[package]
name = "chaum-pedersen-zkp"
version = "1.1.0"
description = "Chaum-Pedersen zero-knowledge protocol implementation"
authors = ["Kobby Pentangeli <kobbypentangeli@gmail.com>"]
repository = "https://github.com/kobby-pentangeli/chaum-pedersen-zkp"
documentation = "https://docs.rs/chaum-pedersen-zkp"
homepage = "https://github.com/kobby-pentangeli/chaum-pedersen-zkp"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["zkp", "chaum-pedersen", "authentication"]
categories = ["cryptography"]
edition = "2024"
rust-version = "1.88"

# prost and tonic-prost are referenced only by the tonic-generated code emitted into OUT_DIR;
# required at build and runtime.
[package.metadata.cargo-machete]
ignored = ["prost", "tonic-prost"]

[lib]
name = "chaum_pedersen"
path = "src/lib.rs"

[[bin]]
name = "server"
path = "src/bin/server.rs"
required-features = ["server"]

[[bin]]
name = "client"
path = "src/bin/client.rs"
required-features = ["client"]

[dependencies]
curve25519-dalek = { version = "4", features = ["alloc", "zeroize", "serde"] }
merlin = "3.0"
zeroize = { version = "1.7", features = ["derive", "alloc"] }
subtle = "2.6"
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"

tonic = { version = "0.14", optional = true }
tonic-prost = { version = "0.14", optional = true }
prost = { version = "0.14", optional = true }
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "signal",
    "fs",
    "io-util",
    "io-std",
], optional = true }
tonic-health = { version = "0.14", optional = true }

clap = { version = "4.5", features = ["derive", "env"], optional = true }
argon2 = { version = "0.5", optional = true }
dotenvy = { version = "0.15", optional = true }
crossterm = { version = "0.29", optional = true }

tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3.20", features = [
    "env-filter",
], optional = true }
metrics = { version = "0.24", optional = true }
metrics-exporter-prometheus = { version = "0.18", optional = true }
hex = { version = "0.4", optional = true }

[build-dependencies]
tonic-prost-build = { version = "0.14", optional = true }

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
tokio-stream = { version = "0.1", features = ["net"] }

[features]
default = []
grpc = [
    "dep:tonic",
    "dep:tonic-prost",
    "dep:prost",
    "dep:tokio",
    "dep:tonic-prost-build",
]
server = [
    "grpc",
    "dep:tonic-health",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:metrics",
    "dep:metrics-exporter-prometheus",
    "dep:dotenvy",
    "dep:hex",
    "dep:crossterm",
    "dep:clap",
]
client = [
    "grpc",
    "dep:clap",
    "dep:argon2",
    "dep:crossterm",
    "dep:tracing",
    "dep:tracing-subscriber",
]

[[bench]]
name = "batch_verification"
harness = false

[[bench]]
name = "proof_generation"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.bench]
inherits = "release"
